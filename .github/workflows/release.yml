name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            jdk-arch: aarch64
          - os: macos-13
            arch: x64
            jdk-arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: ${{ matrix.jdk-arch }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build CLI JAR
        run: ./gradlew :cli:shadowJar --no-daemon

      - name: Build DMG
        run: ./gradlew :composeApp:packageDmg --no-daemon

      - name: Rename DMG with architecture suffix
        run: |
          cd composeApp/build/compose/binaries/main/dmg
          for f in *.dmg; do
            if [[ ! "$f" == *-${{ matrix.arch }}.dmg ]]; then
              mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg"
            fi
          done
          ls -la

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build-dmg
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ARM64 DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: ./dmgs

      - name: Download x64 DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg-x64
          path: ./dmgs

      - name: List DMGs
        run: ls -la ./dmgs

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## Downloads

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | Apple Silicon (M1/M2/M3/M4) | `FinanceHub-*-arm64.dmg` |
          | macOS | Intel | `FinanceHub-*-x64.dmg` |

          ### Installation

          1. Download the DMG file for your Mac architecture
          2. Open the DMG and drag FinanceHub to Applications
          3. On first launch, right-click > Open (to bypass Gatekeeper)

          ### CLI Tool

          The CLI tool `fhub` is bundled inside the app:
          ```bash
          java -jar "/Applications/FinanceHub.app/Contents/Resources/fhub-cli.jar" --help
          ```

          ### What's New

          See commit history for changes since last release.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: FinanceHub ${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: ./dmgs/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build for Windows and Linux
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    if: false  # Disabled by default, set to true to enable
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build MSI
        run: ./gradlew :composeApp:packageMsi --no-daemon

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: composeApp/build/compose/binaries/main/msi/*.msi

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    if: false  # Disabled by default, set to true to enable
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build DEB
        run: ./gradlew :composeApp:packageDeb --no-daemon

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
